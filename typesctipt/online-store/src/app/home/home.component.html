<ul>
  <li *ngFor="let food of foods">
    <a>
      <img [src]="food.imageUrl" alt="food" width="200">
      <div class="content">
        <div class="name">{{ food.name }}</div>
        <span class="favorite {{ food.favorite ? '' : 'not' }}">♥</span>
        <app-star-rating [rating]="food.stars" [readonly]="false"></app-star-rating>

        <div class="product-item-footer"> 
          <div class="origins">
            <span *ngFor="let origin of food.origins">
              {{ origin }}
            </span>
          </div>
          <div class="cook-time"> 
            <span >🕰️</span>
            {{food.cookTime}}
          </div>
        </div>
        <div class="price">
            <span>
                {{food.price|currency}}
            </span>
        </div>

      </div>
    </a>
  </li>
</ul>
