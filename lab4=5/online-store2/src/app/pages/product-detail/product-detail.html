@if (product) {
  <div class="detail">
    <img [src]="product.image" [alt]="product.name">

    <h2>{{ product.name }}</h2>

    <p>{{ product.description }}</p>

    <div class="price">
      {{ product.price }} ₸
    </div>

    <div class="rating">
      ⭐ {{ product.rating }} / 5
    </div>

    <a [href]="product.link" target="_blank">
      Open on Kaspi
    </a>
  </div>
} @else {
  <p>Product not found.</p>
}
